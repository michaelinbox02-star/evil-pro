<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session Injector</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  width:272px;min-height:100px;
  background:#07090e;color:#ddeaf8;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  font-size:12px;line-height:1.5;
}
.hdr{
  padding:12px 13px 11px;border-bottom:1px solid #1a2535;
  display:flex;align-items:center;gap:10px;
}
.hdr-icon{
  width:30px;height:30px;border-radius:8px;flex-shrink:0;
  background:#00c96a12;border:1px solid #00c96a32;
  display:flex;align-items:center;justify-content:center;font-size:17px;
}
.hdr-name{font-size:13px;font-weight:700;letter-spacing:-.2px}
.hdr-status{
  font-size:10px;color:#6b82a0;display:flex;align-items:center;gap:5px;margin-top:1px;
}
.dot{
  width:6px;height:6px;border-radius:50%;flex-shrink:0;
  background:#3d5270;transition:background .2s,box-shadow .2s;
}
.dot.on{background:#00c96a;box-shadow:0 0 5px #00c96a}
.section{padding:9px 13px;border-bottom:1px solid #1a2535}
.section-lbl{
  font-size:9px;font-weight:600;text-transform:uppercase;
  letter-spacing:.09em;color:#3d5270;margin-bottom:6px;
}
.row{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:4px;font-size:11px;gap:6px;
}
.row:last-child{margin-bottom:0}
.row-lbl{color:#6b82a0;flex-shrink:0}
.row-val{
  font-family:ui-monospace,'SFMono-Regular',Consolas,monospace;
  color:#ddeaf8;text-align:right;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;
}
.badge{
  font-size:9px;font-weight:600;padding:1px 6px;border-radius:4px;
  font-family:ui-monospace,'SFMono-Regular',Consolas,monospace;flex-shrink:0;
}
.badge-g{background:#00c96a12;border:1px solid #00c96a32;color:#00c96a}
.badge-d{background:#1a2535;border:1px solid #253040;color:#6b82a0}
.row-val.g{color:#00c96a}
.empty{
  padding:20px 13px;text-align:center;color:#3d5270;font-size:11px;line-height:1.7;
}
.footer{
  padding:9px 13px;display:flex;gap:6px;border-top:1px solid #1a2535;
}
.btn{
  flex:1;padding:6px 8px;border-radius:6px;
  border:1px solid #1a2535;background:#0c1018;
  color:#6b82a0;font-size:11px;cursor:pointer;
  font-family:inherit;transition:all .1s;
}
.btn:hover{background:#111820;color:#ddeaf8;border-color:#253040}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-icon">&#9889;</div>
  <div>
    <div class="hdr-name">Session Injector</div>
    <div class="hdr-status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Checking&hellip;</span>
    </div>
  </div>
</div>

<div id="sessionSection" class="section" style="display:none">
  <div class="section-lbl">Selected Session</div>
  <div class="row">
    <span class="row-lbl">Session</span>
    <span class="row-val" id="popSid">&mdash;</span>
  </div>
  <div class="row">
    <span class="row-lbl">Phishlet</span>
    <span class="row-val" id="popPl">&mdash;</span>
  </div>
  <div class="row">
    <span class="row-lbl">Tokens</span>
    <span class="badge badge-d" id="popTok">none</span>
  </div>
</div>

<div id="injectSection" class="section" style="display:none">
  <div class="section-lbl">Last Inject</div>
  <div class="row">
    <span class="row-lbl">Cookies</span>
    <span class="row-val g" id="popCount">&mdash;</span>
  </div>
  <div class="row">
    <span class="row-lbl">Target</span>
    <span class="row-val" id="popTarget" title="">&mdash;</span>
  </div>
  <div class="row">
    <span class="row-lbl">Time</span>
    <span class="row-val" id="popTime">&mdash;</span>
  </div>
</div>

<div id="emptyState" class="empty">
  Open the dashboard and<br>click a session row.
</div>

<div class="footer">
  <button class="btn" onclick="openDash()">Open Dashboard</button>
</div>

<script src="popup.js"></script>
</body>
</html>
