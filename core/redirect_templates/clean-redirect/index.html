<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting…</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fbfbfc;--text:#111;--muted:#737373;--border:#ececec;--accent:#111}
@media (prefers-color-scheme:dark){:root{--bg:#0d0d0f;--text:#f4f4f5;--muted:#8b8b93;--border:#232327;--accent:#f4f4f5}}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.container{width:520px;max-width:100%}
.brand{margin-bottom:44px;display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center}
.mark svg{width:17px;height:17px;fill:none;stroke:var(--bg);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.wordmark{font-size:15px;font-weight:650;letter-spacing:-.2px}
.title{font-size:42px;font-weight:650;letter-spacing:-1px;line-height:1.1}
.subtitle{margin-top:16px;font-size:17px;line-height:1.7;color:var(--muted)}
.progress{margin-top:40px;height:2px;background:var(--border);overflow:hidden;position:relative;border-radius:2px}
.progress::after{content:"";position:absolute;inset:0;width:35%;background:var(--accent);animation:slide 2s ease-in-out infinite}
.footer{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:14px;color:var(--muted)}
.timer{font-variant-numeric:tabular-nums}
.ts{margin-top:26px;display:flex;justify-content:flex-start}
@keyframes slide{from{transform:translateX(-120%)}to{transform:translateX(420%)}}
@media (max-width:600px){.title{font-size:32px}.subtitle{font-size:16px}}
</style>
</head>
<body>
<div class="container">
  <div class="brand">
    <span class="mark"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5.2c0 4.3-2.9 8.1-7 9.3-4.1-1.2-7-5-7-9.3V6z"/><path d="M9.2 12.2l2 2 3.6-3.9"/></svg></span>
    <span class="wordmark" id="brandName">Secure redirect</span>
  </div>
  <div class="title">Redirecting you securely.</div>
  <div class="subtitle">Please wait while we transfer you to the requested page.</div>
  <div class="progress"></div>
  <div class="footer">
    <span id="status">Preparing destination…</span>
    <span class="timer" id="timer">3s</span>
  </div>
  <div class="ts"><div id="__ts_slot__"></div></div>
</div>
<script>
var DEST = "__DESTINATION__", DELAY = __DELAY__;
function __finish(){ if(window.__tsPending) return; if(DEST) window.location.replace(DEST); }
window.__tsGo = __finish;

var seconds = DELAY;
var timer = document.getElementById("timer"), status = document.getElementById("status");
var messages = ["Preparing destination…","Establishing secure connection…","Almost there…"];
var mi = 0;
var si = setInterval(function(){ if(mi < messages.length-1){ mi++; status.textContent = messages[mi]; } }, Math.max(700, DELAY*1000/ messages.length));
var cd = setInterval(function(){ seconds--; timer.textContent = Math.max(seconds,0) + "s"; if(seconds <= 0){ clearInterval(cd); clearInterval(si); __finish(); } }, 1000);
setTimeout(function(){ if(window.__tsPending){ window.__tsPending = false; __finish(); } }, (DELAY + 4) * 1000);
</script>
</body>
</html>
