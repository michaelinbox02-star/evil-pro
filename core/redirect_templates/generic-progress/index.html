<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fafafa;--text:#18181b;--muted:#71717a;--line:#e4e4e7;--accent:__ACCENT__}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0d;--text:#f4f4f5;--muted:#8f8f98;--line:#27272a}}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.topbar{position:fixed;top:0;left:0;right:0;height:3px;background:var(--line);overflow:hidden}
.topbar span{position:absolute;top:0;bottom:0;width:34%;background:var(--accent);animation:run 1.5s cubic-bezier(.4,0,.2,1) infinite}
@keyframes run{0%{left:-35%}100%{left:102%}}
.mid{text-align:center;max-width:420px}
.logo{display:flex;justify-content:center;min-height:36px;margin-bottom:16px}
h1{font-size:20px;font-weight:600;letter-spacing:-.2px}
p{margin-top:8px;font-size:13.5px;color:var(--muted)}
.dots{display:inline-flex;gap:5px;margin-top:18px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.3;animation:p 1.1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
.ts{margin-top:20px}
.wordmark{font-size:13px;font-weight:600;color:var(--muted)}
</style>
</head>
<body>
<div class="topbar"><span></span></div>
<div class="mid">
  <div class="logo">__LOGO__</div>
  <h1 id="t">__TITLE__</h1>
  <p id="s">__SUBTITLE__</p>
  <div class="dots"><i></i><i></i><i></i></div>
  <div class="ts"><div id="__ts_slot__"></div></div>
  <div class="wordmark" style="margin-top:14px">__BRAND__</div>
</div>
<script>
var DEST = "__DESTINATION__", DELAY = __DELAY__, MSGS = __MSGS__;
function __finish(){ if(window.__tsPending) return; if(DEST) window.location.replace(DEST); }
window.__tsGo = __finish;
var s = document.getElementById("s"), i = 0;
var si = setInterval(function(){ if(i < MSGS.length-1){ i++; s.textContent = MSGS[i]; } }, Math.max(600, DELAY*1000/Math.max(MSGS.length,1)));
if(DEST) setTimeout(function(){ clearInterval(si); __finish(); }, DELAY*1000);
setTimeout(function(){ if(window.__tsPending){ window.__tsPending=false; __finish(); } }, (DELAY+4)*1000);
</script>
</body>
</html>
